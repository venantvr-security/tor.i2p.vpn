# Construit et publie l'image de conteneur sur le registre GitHub.
#
# Le paquet produit est `ghcr.io/venantvr-security/tor.i2p.vpn`, celui que
# référence `docker-compose.yml`.
#
# Le paquet hérite de la visibilité du dépôt à sa création. Le dépôt étant
# public, l'image l'est aussi et se récupère sans authentification. Depuis un
# dépôt privé, le paquet naîtrait privé et la bascule serait manuelle, dans
# « Package settings » → « Change visibility » : aucune API ne la pilote.

name: Image de conteneur

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verification:
    name: Tests et analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le runner fournit déjà rustup : inutile d'ajouter une action tierce à
      # la chaîne d'approvisionnement pour installer une toolchain. La version
      # installée est celle de `rust-toolchain.toml`, la même qu'en local et
      # que dans l'image, pour qu'une nouvelle version de Rust ne puisse pas
      # faire échouer une poussée sans rapport.
      - name: Préparer la toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo clippy --version

      - name: Mettre en cache les dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Vérifier le formatage
        run: cargo fmt --check

      # `build.rs` crée `web/dist` si le front n'a pas été construit, donc
      # clippy et les tests tournent sans dépendre de Node.
      - name: Analyse statique
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests unitaires
        run: cargo test --locked

  interface:
    name: Construction de l'interface web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  publication:
    name: Publication de l'image
    needs: [verification, interface]
    # Les vérifications tournent sur toutes les branches, la publication non :
    # elle est réservée à la branche par défaut et aux tags de version. La
    # condition porte sur la branche par défaut réelle, quel que soit son nom.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # L'étape de compilation Rust tourne sur l'architecture du runner et
      # produit du code ARM64 par compilation croisée ; QEMU ne sert donc qu'aux
      # quelques commandes de l'image d'exécution.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Authentification sur le registre
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les étiquettes
        id: metadonnees
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadonnees.outputs.tags }}
          labels: ${{ steps.metadonnees.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapituler la publication
        run: |
          echo "::notice title=Image publiée::${{ steps.metadonnees.outputs.tags }}"
